<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<!-- Sumber thumbnail katalog (1200×1500, 4:5). Render ulang: buka di Chrome 1200×1500 lalu screenshot. -->
<title>Thumbnail — Undangan Minimalist</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Geist:wght@400;500&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root { --canvas: #faf9f6; --ink: #252321; --muted: #77716a; --accent: #c9b79c; --accent-deep: #7c6a4f; --line: #d6d0c6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 1500px; overflow: hidden; }
  body { background: var(--canvas); color: var(--ink); font-family: 'Geist', sans-serif; padding: 64px 72px 66px; display: flex; flex-direction: column; }
  .label { font: 500 17px/1.4 'Geist', sans-serif; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .rule { height: 1px; background: var(--line); margin: 22px 0 0; }

  .title { margin-top: 70px; display: grid; justify-items: center; gap: 18px; font: 300 196px/.86 'Plus Jakarta Sans', sans-serif; text-transform: uppercase; text-align: center; }
  .name { letter-spacing: .12em; margin-right: -.12em; }
  .mid { display: flex; align-items: center; gap: 40px; }
  .amp { font: italic 400 112px/1 'Cormorant Garamond', serif; color: var(--accent-deep); text-transform: none; }
  .pic { width: 250px; aspect-ratio: 3 / 2; overflow: hidden; }
  .pic img, .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .meta { margin-top: 66px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 400 22px 'Plus Jakarta Sans', sans-serif; letter-spacing: 3px; text-transform: uppercase; }
  .meta span:nth-child(2) { font: italic 400 30px 'Cormorant Garamond', serif; letter-spacing: 0; text-transform: none; color: var(--accent-deep); }
  .meta span:last-child { text-align: right; }

  .strip { margin-top: 44px; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 18px; flex: 1; min-height: 0; }
  .strip figure { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .strip .ph { flex: 1; min-height: 0; overflow: hidden; }
  .strip figcaption { display: flex; justify-content: space-between; font: 500 14px 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

  .foot { margin-top: 34px; display: flex; justify-content: space-between; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 16px; padding: 20px 30px; background: var(--ink); color: var(--canvas); font: 500 17px 'Geist'; letter-spacing: 4px; text-transform: uppercase; }
  .btn svg { width: 24px; height: 24px; }
  .tagline { font: italic 400 30px 'Cormorant Garamond', serif; color: var(--ink); }
  .tagline b { font: 500 15px 'Geist'; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="row"><p class="label">The wedding of</p><p class="label">13.02.2027</p></div>
  <div class="rule"></div>

  <h1 class="title">
    <span class="name">Dimas</span>
    <span class="mid"><span class="amp">&amp;</span><span class="pic"><img src="../public/img-undangan/d0defbbc7f6b72c5f8f8f7620ad5691a.jpg" alt="" /></span></span>
    <span class="name">Alya</span>
  </h1>

  <div class="meta"><span>Sabtu</span><span>13 Februari 2027</span><span>Jakarta</span></div>

  <div class="strip">
    <figure><div class="ph"><img src="../public/img-undangan/45c3f0078259ab963014c4d835a8c48e.jpg" alt="" style="object-position:center 60%" /></div><figcaption><span>01</span><span>Kami menikah</span></figcaption></figure>
    <figure><div class="ph"><img src="../public/img-undangan/a751177140d9a863db5f558a5c12d23a.jpg" alt="" /></div><figcaption><span>02</span><span>Cerita</span></figcaption></figure>
    <figure><div class="ph"><img src="../public/img-undangan/0a2085c735ff185d105bef9eb93f3b47.jpg" alt="" /></div><figcaption><span>03</span><span>Acara</span></figcaption></figure>
  </div>

  <div class="foot">
    <p class="tagline"><b>Minimalist</b>Sederhana, tenang, penuh gerak.</p>
    <span class="btn">Buka Undangan <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
  </div>
</body>
</html>
